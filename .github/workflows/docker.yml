name: Docker image

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Several quick pushes only produce one build
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/arclights/finance-overview

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      # Caches the Gradle distribution and dependencies between runs
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One manifest per image, so the cleanup below can't orphan attestations
          provenance: false

      - uses: actions/delete-package-versions@v5
        with:
          package-name: finance-overview
          package-type: container
          min-versions-to-keep: 10
